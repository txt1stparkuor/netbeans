<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout1 :: layout(~{::section})}">
<body>

<section>
    <div class="page-header">
        <h2>Add User</h2>
    </div>

    <!-- We wrap the form in a card and limit its width to look like a modal/clean form -->
    <div class="card form-card">
        
        <!-- th:object binds this entire form to the 'userDto' passed from the controller -->
        <form th:action="@{/users/create}" th:object="${userDto}" method="post">
            
            <!-- Global Error Message (e.g., Duplicate Username) -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <!-- Username Field -->
			<!-- Username Field -->
			<div class="form-group">
			    <label>Username <span class="required">*</span></label>
			    <!-- Added: required, minlength, maxlength -->
			    <input type="text" class="form-control" th:field="*{username}" placeholder="admin" 
			           required minlength="3" maxlength="50">
			    <span class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
			</div>

			<!-- Email Field -->
			<div class="form-group">
			    <label>Email <span class="required">*</span></label>
			    <!-- Added: required. (type="email" already enforces email format in the browser) -->
			    <input type="email" class="form-control" th:field="*{email}" required>
			    <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
			</div>

			<!-- Full Name Field -->
			<div class="form-group">
			    <label>Full Name <span class="required">*</span></label>
			    <!-- Added: required -->
			    <input type="text" class="form-control" th:field="*{fullName}" required>
			    <span class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
			</div>

			<!-- Password Field -->
			<div class="form-group">
			    <label>Password <span class="required">*</span></label>
			    <!-- Added: required, minlength="6" -->
			    <input type="password" class="form-control" th:field="*{password}" required minlength="6">
			    <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
			</div>

			<!-- Role Dropdown -->
			<div class="form-group">
			    <label>Role <span class="required">*</span></label>
			    <!-- Added: required -->
			    <select class="form-control" th:field="*{role}" required>
			        <option value="">-- Select a Role --</option> <!-- Good practice to have an empty default -->
			        <option th:each="roleOpt : ${roles}" th:value="${roleOpt}" th:text="${roleOpt}"></option>
			    </select>
			    <span class="text-danger" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></span>
			</div>

            <!-- Buttons -->
            <div class="form-actions">
                <a th:href="@{/users}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            
        </form>
    </div>
</section>

</body>
</html>
